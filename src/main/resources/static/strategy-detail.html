<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Strategy Guide — Learning Center</title>
    <meta name="description" content="Detailed guide and documentation for options trading strategy">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
    <link rel="stylesheet" href="/style.css?v=11">
    <script src="/theme.js?v=3"></script>
</head>

<body>
    <div class="app-layout">
        <!-- Mobile menu toggle -->
        <button class="menu-toggle" onclick="toggleSidebar()">☰</button>

        <!-- Sidebar -->
        <nav class="sidebar" data-sidebar></nav>
        <div class="sidebar-backdrop" onclick="toggleSidebar()"></div>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Auth Loading Overlay -->
            <div id="authLoading" class="auth-loading-overlay">
                <div class="auth-spinner"></div>
                <p>Authenticating…</p>
            </div>

            <div class="strategy-detail-container">
                <!-- Navigation & Switcher Header -->
                <div class="strategy-detail-nav">
                    <a href="/option-strategies.html" class="btn btn-ghost btn-sm" style="display:inline-flex; align-items:center; gap:6px;">
                        <span>←</span>
                        <span>Back to Option Strategies</span>
                    </a>
                    <div class="strategy-detail-actions">
                        <div class="strategy-switcher-wrap">
                            <label for="strategy-select-switcher" class="text-muted small" style="white-space:nowrap;">Switch:</label>
                            <select id="strategy-select-switcher" class="strategy-select-switcher" aria-label="Switch Option Strategy">
                                <option value="">Loading strategies...</option>
                            </select>
                        </div>
                        <a id="execute-strategy-btn" href="/execute.html" class="btn btn-primary btn-sm" data-admin-only style="display:inline-flex; align-items:center; gap:6px;">
                            <span>▶</span>
                            <span>Execute Strategy</span>
                        </a>
                    </div>
                </div>

                <!-- Strategy Detail Card -->
                <div class="card" style="padding: 28px 32px;">
                    <div id="strategy-markdown-content" class="markdown-body">
                        <div class="loading-state" style="padding: 40px 20px;">
                            <div class="spinner"></div>
                            <p>Loading strategy guide...</p>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked-katex-extension@5.1.2/lib/index.umd.js"></script>
    <script src="/js/utils.js?v=12"></script>
    <script src="/js/auth-api.js?v=11"></script>
    <script src="/js/learning-center.js?v=4"></script>
    <script src="/app.js?v=8"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            await initAuth();
            await initStrategyDetailPage();
        });
    </script>
</body>
</html>
