<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trading Bot — Screeners Dashboard</title>
    <meta name="description" content="Real-time technical screener execution monitor for automated stock screening">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
    <link rel="stylesheet" href="/style.css?v=13">
    <script src="/theme.js?v=3"></script>
</head>

<body>
    <div class="app-layout">
        <!-- Mobile menu toggle -->
        <button class="menu-toggle" onclick="toggleSidebar()">☰</button>

        <!-- Sidebar -->
        <nav class="sidebar" data-sidebar></nav>
        <div class="sidebar-backdrop" onclick="toggleSidebar()"></div>

        <!-- Main Content -->
        <main class="main-content">
            <h1 class="page-title">Screeners Dashboard</h1>
            <p class="page-subtitle">Real-time technical screener execution monitor</p>

            <!-- Screener Selector (admin only) -->
            <div class="card" data-admin-only>
                <div class="collapsible-header" onclick="toggleSection('screener-section')">
                    <span class="card-arrow" id="arrow-screener-section">▶</span>
                    <h3 style="font-size:0.9rem; margin:0; color:var(--text-secondary)">Technical Screeners</h3>
                    <span class="text-muted small" id="screener-count-badge"></span>
                </div>
                <div class="collapsible-body" id="screener-section">
                    <div class="checkbox-group" id="screener-checkboxes">
                        <span class="text-muted">Loading screeners...</span>
                    </div>
                </div>
                <div class="flex gap-sm mt-sm">
                    <button class="btn btn-sm btn-ghost" onclick="selectAllScreeners(true)">Select All</button>
                    <button class="btn btn-sm btn-ghost" onclick="selectAllScreeners(false)">Clear All</button>
                </div>
            </div>

            <!-- Execution Controls (admin only) -->
            <div class="flex gap-sm items-center mb-md" data-admin-only>
                <button class="btn btn-primary" id="execute-btn" onclick="executeScreenersSelected()">
                    ▶ Execute Selected
                </button>
                <button class="btn btn-danger" id="stop-btn" onclick="cancelExecution()" style="display:none">
                    ⏹ Stop
                </button>
            </div>

            <!-- Progress (admin only) -->
            <div class="progress-container" id="progress-container" data-admin-only>
                <div class="progress-bar">
                    <div class="progress-fill" style="width:30%"></div>
                </div>
                <p class="progress-text" id="elapsed-text">Executing screeners...</p>
            </div>

            <!-- Screener Results -->
            <h3 style="font-size:1rem; margin-bottom:12px; color:var(--text-secondary)">Latest Technical Screener Results</h3>

            <!-- Results Filter Bar -->
            <div id="screeners-filter-bar" class="results-filter-bar" style="display:none;">
                <div class="filter-bar-row">
                    <select id="screeners-filter-column" class="filter-select" onchange="onFilterColumnChange('screeners')">
                        <option value="ticker" selected>Ticker</option>
                    </select>
                    <input type="text" id="screeners-filter-text" class="filter-input"
                           placeholder="e.g. AAPL"
                           onkeydown="if(event.key==='Enter') applyDashboardFilter('screeners')" />
                    <button id="screeners-filter-btn" class="btn btn-primary btn-sm filter-search-btn"
                            onclick="applyDashboardFilter('screeners')">
                        🔍 Search
                    </button>
                    <button id="screeners-filter-clear" class="btn btn-ghost btn-sm"
                            style="display:none;" onclick="clearDashboardFilter('screeners')">
                        ✕ Clear
                    </button>
                </div>
                <div id="screeners-filter-summary" class="filter-summary-text"></div>
            </div>

            <div id="screener-results-container">
                <div class="empty-state">
                    <div class="empty-state-icon">🔎</div>
                    Loading screener results...
                </div>
            </div>
        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked-katex-extension@5.1.2/lib/index.umd.js"></script>
    <script src="/js/utils.js?v=12"></script>
    <script src="/js/auth-api.js?v=1"></script>
    <script src="/js/dashboard.js?v=2"></script>
    <script src="/js/screener-execute.js?v=1"></script>
    <script src="/app.js?v=6"></script>
    <script>
        document.addEventListener('DOMContentLoaded', initScreenerDashboard);
    </script>

</body>

</html>
