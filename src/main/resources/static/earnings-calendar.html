<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Earnings Calendar — Trading Bot</title>
    <meta name="description" content="Monthly calendar view of upcoming earnings events for tracked securities">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/style.css?v=13">
    <script src="/theme.js?v=3"></script>
</head>
<body>
    <div class="app-layout">
        <!-- Mobile menu toggle -->
        <button class="menu-toggle" onclick="toggleSidebar()">☰</button>

        <!-- Sidebar -->
        <nav class="sidebar" data-sidebar></nav>
        <div class="sidebar-backdrop" onclick="toggleSidebar()"></div>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Auth Loading Overlay -->
            <div id="authLoading" class="auth-loading-overlay">
                <div class="auth-spinner"></div>
                <p>Authenticating…</p>
            </div>

            <div class="page-header-flex">
                <div>
                    <h1 class="page-title">Earnings Calendar</h1>
                    <p class="page-subtitle">Monthly view of upcoming earnings events for tracked securities</p>
                </div>
                <div class="header-actions">
                    <span class="cal-sync-badge" id="cal-last-pulled" title="Timestamp of the latest earnings calendar cache update">
                        <span class="status-dot"></span>
                        <span id="cal-last-pulled-text">Last Pulled: —</span>
                    </span>
                    <button id="cal-refresh-btn" class="btn cal-refresh-btn" data-admin-only onclick="refreshAllEarnings()" title="Fetch latest earnings for all project stocks across all predefined YAML files">
                        <span class="cal-refresh-icon" id="cal-refresh-icon">↻</span>
                        <span id="cal-refresh-text">Refresh Earnings</span>
                    </button>
                </div>
            </div>

            <!-- Calendar Navigation -->
            <div class="cal-nav">
                <button class="btn btn-ghost btn-sm" id="cal-prev" onclick="calNavigate(-1)">‹ Prev</button>
                <h2 class="cal-month-label" id="cal-month-label"></h2>
                <button class="btn btn-ghost btn-sm" id="cal-next" onclick="calNavigate(1)">Next ›</button>
                <button class="btn btn-ghost btn-sm cal-today-btn" id="cal-today" onclick="calGoToday()">Today</button>
            </div>

            <!-- Calendar Grid -->
            <div class="cal-grid" id="cal-grid">
                <div class="cal-header-cell">Sun</div>
                <div class="cal-header-cell">Mon</div>
                <div class="cal-header-cell">Tue</div>
                <div class="cal-header-cell">Wed</div>
                <div class="cal-header-cell">Thu</div>
                <div class="cal-header-cell">Fri</div>
                <div class="cal-header-cell">Sat</div>
            </div>

            <!-- Event Detail Panel (shown on day click) -->
            <div class="cal-detail-panel card" id="cal-detail-panel" style="display:none;">
                <div class="cal-detail-header">
                    <h3 id="cal-detail-date"></h3>
                    <button class="btn btn-ghost btn-sm" onclick="closeDetailPanel()">✕</button>
                </div>
                <div id="cal-detail-body"></div>
            </div>
        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="/js/utils.js?v=2"></script>
    <script src="/js/auth-api.js?v=1"></script>
    <script src="/js/earnings-calendar.js?v=4"></script>
    <script src="/app.js?v=7"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            await initAuth();
            initEarningsCalendar();
        });
    </script>
</body>
</html>
