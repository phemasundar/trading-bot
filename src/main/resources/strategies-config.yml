    securitiesFile: "top100, portfolio, tracking, 2026, SPY, QQQ"
    technicalFilters:
      PRICE_DROP:
        conditions:
          - "DROP_PCT >= 15"
        config:
          lookbackDays: 63
  - enabled: true
    alias: "Down from 52W High"
    screenerType: "HIGH_52W_DROP"
    securitiesFile: "top100, portfolio, tracking, 2026, SPY, QQQ"
    technicalFilters:
      PRICE_DROP:
        conditions:
          - "DROP_PCT >= 20"
    fundamentalFilters:
      MARKET_CAP:
        conditions:
          - "MARKET_CAP_B >= 1"
  - enabled: true
    alias: "ATR Screener"
    screenerType: "ATR"
    descriptionFile: "atr_screener.md"
    securitiesFile: "top100, portfolio, tracking, 2026, SPY, QQQ"
    technicalFilters:
      AVERAGE_TRUE_RANGE:
        config:
          period: 14
        conditions:
          - "NATR >= 1.5"
          - "PRICE_DROP_FROM_HIGH_5D >= 2 * ATR"
      VOLUME:
        conditions:
          - "VOLUME >= 1000000"
