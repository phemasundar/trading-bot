---
technicalIndicatorConfigs:
  default:
    RSI:
      period: 14
      oversoldThreshold: 30
      overboughtThreshold: 70
    BOLLINGER_BAND:
      bollingerPeriod: 20
      bollingerStdDev: 2
  rsiSample2:
    RSI:
      period: 14
      oversoldThreshold: 40
      overboughtThreshold: 60
technicalFilters:
  oversold:
    RSI:
      config: "default"
      condition: "BULLISH_CROSSOVER"
    BOLLINGER_BAND:
      config: "default"
      condition: "LOWER_BAND"
    VOLUME:
      conditions:
        - "VOLUME >= 1000000"
    HISTORICAL_VOLATILITY:
      config:
        period: 20
      conditions:
        - "HV_RANK >= 25"
  overbought:
    RSI:
      config: "default"
      condition: "BEARISH_CROSSOVER"
    BOLLINGER_BAND:
      config: "default"
      condition: "UPPER_BAND"
    VOLUME:
      conditions:
        - "VOLUME >= 1000000"
    HISTORICAL_VOLATILITY:
      config:
        period: 20
      conditions:
        - "HV_RANK >= 25"
  ema_cross:
    SIMPLE_MOVING_AVERAGE:
      conditions:
        - "SMA50 >= SMA200"
    EXP_MOVING_AVERAGE:
      conditions:
        - "EMA9 >= EMA21"
    VOLUME:
      conditions:
        - "VOLUME >= 1000000"
optionsStrategies:
  - alias: "PCS"
    enabled: true
    termType: "Short Term"
    strategyType: "PUT_CREDIT_SPREAD"
    descriptionFile: "put_credit_spread.md"
    filterType: "CreditSpreadFilter"
    filter:
      minDTE: 25
      maxDTE: 50
      maxLossLimit: 1000
      minReturnOnRisk: 12
      shortLeg:
        maxDelta: 0.2
        minOpenInterest: 500
      earningsFilters:
        conditions:
          - "DAYS_TO_NEXT_EARNINGS >= DTE"
    greeks:
      delta: "positive"
      gamma: "negative"
      theta: "positive"
      vega: "negative"
    securitiesFile: "portfolio"
    technicalFilters:
      HISTORICAL_VOLATILITY:
        config:
          period: 20
        conditions:
          - "HV_RANK >= 25"
