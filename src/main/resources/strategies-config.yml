---
technicalIndicatorConfigs:
  default:
    RSI:
      period: 14
      oversoldThreshold: 30
      overboughtThreshold: 70
    BOLLINGER_BAND:
      bollingerPeriod: 20
      bollingerStdDev: 2
  rsiSample2:
    RSI:
      period: 14
      oversoldThreshold: 40
      overboughtThreshold: 60
technicalFilters:
  oversold:
    RSI:
      config: "default"
      condition: "BULLISH_CROSSOVER"
    BOLLINGER_BAND:
      config: "default"
      condition: "LOWER_BAND"
    VOLUME:
      conditions:
        - "VOLUME >= 1000000"
    HISTORICAL_VOLATILITY:
      config:
        period: 20
      conditions:
        - "HV_RANK >= 25"
  overbought:
    RSI:
      config: "default"
      condition: "BEARISH_CROSSOVER"
    BOLLINGER_BAND:
      config: "default"
      condition: "UPPER_BAND"
    VOLUME:
      conditions:
        - "VOLUME >= 1000000"
    HISTORICAL_VOLATILITY:
      config:
        period: 20
      conditions:
        - "HV_RANK >= 25"
  ema_cross:
    SIMPLE_MOVING_AVERAGE:
      conditions:
        - "SMA50 >= SMA200"
    EXP_MOVING_AVERAGE:
      conditions:
        - "EMA9 >= EMA21"
    VOLUME:
      conditions:
        - "VOLUME >= 1000000"
optionsStrategies:
  - alias: "PCS"
    enabled: true
    termType: "Short Term"
    strategyType: "PUT_CREDIT_SPREAD"
    descriptionFile: "put_credit_spread.md"
    filterType: "CreditSpreadFilter"
    filter:
      conditions:
        - "DTE >= 25"
        - "DTE <= 50"
        - "MAX_LOSS <= 1000"
        - "RETURN_ON_RISK >= 12"
      shortLeg:
        conditions:
          - "DELTA <= 0.2"
          - "OPEN_INTEREST >= 500"
      earningsFilters:
        conditions:
          - "DAYS_TO_NEXT_EARNINGS >= DTE"
    securitiesFile: "portfolio"
    technicalFilters:
      HISTORICAL_VOLATILITY:
        config:
          period: 20
        conditions:
          - "HV_RANK >= 25"
  - alias: "PCS"
    enabled: true
    termType: "Medium Term"
    strategyType: "PUT_CREDIT_SPREAD"
    descriptionFile: "put_credit_spread.md"
    filterType: "CreditSpreadFilter"
    filter:
      conditions:
        - "DTE >= 55"
        - "DTE <= 185"
        - "MAX_LOSS <= 2000"
        - "RETURN_ON_RISK >= 24"
      shortLeg:
        conditions:
          - "DELTA <= 0.2"
          - "OPEN_INTEREST >= 100"
    securitiesFile: "tracking, 2026"
    technicalFilters:
      HISTORICAL_VOLATILITY:
        config:
          period: 20
        conditions:
          - "HV_RANK >= 25"
  - alias: "Tech RSI/BB PCS"
    enabled: true
    termType: "Short Term"
    strategyType: "TECH_PUT_CREDIT_SPREAD"
    descriptionFile: "tech_put_credit_spread.md"
    filterType: "CreditSpreadFilter"
    filter:
      targetDTE: 30
      conditions:
        - "MAX_LOSS <= 1000"
        - "RETURN_ON_RISK >= 12"
      shortLeg:
        conditions:
          - "DELTA <= 0.3"
          - "OPEN_INTEREST >= 500"
      earningsFilters:
        conditions:
          - "DAYS_TO_NEXT_EARNINGS >= DTE"
    securitiesFile: "top100"
    technicalFilters: "oversold"
  - alias: "Standard CCS"
    enabled: true
    termType: "Short Term"
    strategyType: "CALL_CREDIT_SPREAD"
    descriptionFile: "call_credit_spread.md"
    filterType: "CreditSpreadFilter"
    filter:
      targetDTE: 30
      conditions:
        - "MAX_LOSS <= 1000"
        - "RETURN_ON_RISK >= 12"
      shortLeg:
        conditions:
          - "DELTA <= 0.2"
          - "OPEN_INTEREST >= 500"
      earningsFilters:
        conditions:
          - "DAYS_TO_NEXT_EARNINGS >= DTE"
    securitiesFile: "portfolio"
    technicalFilters:
      HISTORICAL_VOLATILITY:
        config:
          period: 20
        conditions:
          - "HV_RANK >= 25"
  - alias: "Tech RSI/BB CCS"
    enabled: true
    termType: "Short Term"
    strategyType: "TECH_CALL_CREDIT_SPREAD"
    descriptionFile: "tech_call_credit_spread.md"
    filterType: "CreditSpreadFilter"
    filter:
      targetDTE: 30
      conditions:
        - "MAX_LOSS <= 1000"
        - "RETURN_ON_RISK >= 12"
      shortLeg:
        conditions:
          - "DELTA <= 0.3"
          - "OPEN_INTEREST >= 500"
      earningsFilters:
        conditions:
          - "DAYS_TO_NEXT_EARNINGS >= DTE"
    securitiesFile: "top100"
    technicalFilters: "overbought"
  - alias: "0 DTE Iron Condor"
    enabled: true
    termType: "Daily"
    strategyType: "IRON_CONDOR"
    descriptionFile: "iron_condor.md"
    filterType: "IronCondorFilter"
    filter:
      conditions:
        - "DTE >= 0"
        - "DTE <= 1"
        - "MAX_LOSS <= 500"
        - "RETURN_ON_RISK >= 12"
      putShortLeg:
        conditions:
          - "DELTA <= 0.15"
          - "OPEN_INTEREST >= 100"
      callShortLeg:
        conditions:
          - "DELTA <= 0.15"
          - "OPEN_INTEREST >= 100"
      earningsFilters:
        conditions:
          - "DAYS_TO_NEXT_EARNINGS >= DTE"
    securitiesFile: "portfolio"
    technicalFilters:
      HISTORICAL_VOLATILITY:
        config:
          period: 20
        conditions:
          - "HV_RANK >= 25"
  - alias: "Iron Condor"
    enabled: true
    termType: "Medium Term"
    strategyType: "IRON_CONDOR"
    descriptionFile: "iron_condor.md"
    filterType: "IronCondorFilter"
    filter:
      conditions:
        - "DTE >= 40"
        - "DTE <= 65"
        - "MAX_LOSS <= 1000"
        - "RETURN_ON_RISK >= 24"
      putShortLeg:
        conditions:
          - "DELTA <= 0.15"
          - "OPEN_INTEREST >= 100"
      callShortLeg:
        conditions:
          - "DELTA <= 0.15"
          - "OPEN_INTEREST >= 100"
      earningsFilters:
        conditions:
          - "DAYS_TO_NEXT_EARNINGS >= DTE"
    securitiesFile: "portfolio, 2026"
    technicalFilters:
      HISTORICAL_VOLATILITY:
        config:
          period: 20
        conditions:
          - "HV_RANK >= 25"
  - alias: "Iron Condor"
    enabled: true
    termType: "Medium Term 2"
    strategyType: "IRON_CONDOR"
    descriptionFile: "iron_condor.md"
    filterType: "IronCondorFilter"
    filter:
      conditions:
        - "DTE >= 55"
        - "DTE <= 185"
        - "MAX_LOSS <= 2000"
        - "RETURN_ON_RISK >= 36"
      putShortLeg:
        conditions:
          - "DELTA <= 0.15"
          - "OPEN_INTEREST >= 100"
      callShortLeg:
        conditions:
          - "DELTA <= 0.15"
          - "OPEN_INTEREST >= 100"
    securitiesFile: "bullish, 2026"
    technicalFilters:
      HISTORICAL_VOLATILITY:
        config:
          period: 20
        conditions:
          - "HV_RANK >= 25"
  - alias: "Moderate LEAP"
    enabled: true
    termType: "Extra Long Term"
    strategyType: "LONG_CALL_LEAP"
    descriptionFile: "long_call_leap.md"
    filterType: "LongCallLeapFilter"
    securitiesFile: "portfolio, tracking, 2026"
    filter:
      marginInterestRate: 6
      savingsInterestRate: 10
      conditions:
        - "DTE >= 330"
        - "OPTION_PRICE_PERCENT <= 50"
        - "BREAKEVEN_CAGR <= 15"
        - "COST_SAVINGS_PERCENT >= 10"
        - "MAX_LOSS <= 5000"
        - "IV_PERCENTILE <= 30"
      longCall:
        conditions:
          - "DELTA >= 0.4"
          - "OPEN_INTEREST >= 1"
  - alias: "Tech Moderate LEAP"
    enabled: true
    termType: "Extra Long Term"
    strategyType: "LONG_CALL_LEAP"
    descriptionFile: "long_call_leap.md"
    filterType: "LongCallLeapFilter"
    securitiesFile: "portfolio, tracking, bullish, 2026, top100, SPY, QQQ"
    filter:
      marginInterestRate: 6
      savingsInterestRate: 10
      conditions:
        - "DTE >= 330"
        - "OPTION_PRICE_PERCENT <= 50"
        - "BREAKEVEN_CAGR <= 15"
        - "COST_SAVINGS_PERCENT >= 10"
        - "MAX_LOSS <= 5000"
        - "IV_PERCENTILE <= 30"
      longCall:
        conditions:
          - "DELTA >= 0.4"
          - "OPEN_INTEREST >= 1"
    technicalFilters:
      RSI:
        config: "default"
        condition:
          type: "CUSTOM_RANGE"
          min: 45
          max: 65
      SIMPLE_MOVING_AVERAGE:
        conditions:
          - "PRICE >= SMA50"
          - "SMA50 >= SMA200"
      VOLUME:
        conditions:
          - "VOLUME_SMA20 >= VOLUME_SMA50 * 90%"
  - alias: "Aggressive LEAP"
    enabled: true
    termType: "Extra Long Term"
    strategyType: "LONG_CALL_LEAP"
    descriptionFile: "long_call_leap.md"
    filterType: "LongCallLeapFilter"
    securitiesFile: "top100, SPY, QQQ"
    filter:
      marginInterestRate: 6
      savingsInterestRate: 10
      conditions:
        - "DTE >= 330"
        - "OPTION_PRICE_PERCENT <= 40"
        - "BREAKEVEN_CAGR <= 10"
        - "COST_SAVINGS_PERCENT >= 10"
        - "MAX_LOSS <= 5000"
        - "IV_PERCENTILE <= 30"
      longCall:
        conditions:
          - "DELTA >= 0.4"
          - "OPEN_INTEREST >= 1"
  - alias: "LEAP Top 5"
    enabled: true
    termType: "Extra Long Term"
    strategyType: "LONG_CALL_LEAP"
    descriptionFile: "long_call_leap.md"
    filterType: "LongCallLeapFilter"
    securitiesFile: "bullish"
    filter:
      topTradesCount: 5
      maxTradesToSend1: 5
      marginInterestRate: 6
      savingsInterestRate: 10
      conditions:
        - "DTE >= 330"
        - "OPTION_PRICE_PERCENT <= 50"
        - "BREAKEVEN_CAGR <= 20"
        - "COST_SAVINGS_PERCENT >= 5"
        - "IV_PERCENTILE <= 30"
      longCall:
        conditions:
          - "DELTA >= 0.3"
          - "OPEN_INTEREST >= 1"
      relaxationPriority1:
        - "maxCAGRForBreakEven"
        - "maxOptionPricePercent"
        - "minCostSavingsPercent"
      sortPriority:
        - "daysToExpiration"
        - "costSavingsPercent"
        - "optionPricePercent"
        - "breakevenCAGR"
  - alias: "BWB Conservative"
    enabled: true
    termType: "Short Term"
    strategyType: "BULLISH_BROKEN_WING_BUTTERFLY"
    descriptionFile: "bullish_bwb.md"
    filterType: "BrokenWingButterflyFilter"
    filter:
      targetDTE: 30
      conditions:
        - "TOTAL_DEBIT <= 100"
        - "MAX_LOSS <= 1000"
        - "UPPER_BREAK_EVEN_DELTA <= 0.15"
      leg1Long:
        conditions:
          - "DELTA >= 0.5"
          - "OPEN_INTEREST >= 100"
      leg2Short:
        conditions:
          - "DELTA <= 0.4"
          - "OPEN_INTEREST >= 100"
      earningsFilters:
        conditions:
          - "DAYS_TO_NEXT_EARNINGS >= DTE"
    securitiesFile: "portfolio, 2026"
  - alias: "BWB Active"
    enabled: true
    termType: "Short Term"
    maxTradesToSend: 10
    strategyType: "BULLISH_BROKEN_WING_BUTTERFLY"
    descriptionFile: "bullish_bwb.md"
    filterType: "BrokenWingButterflyFilter"
    filter:
      conditions:
        - "DTE >= 25"
        - "DTE <= 55"
        - "TOTAL_DEBIT <= 100"
        - "MAX_LOSS <= 1000"
        - "UPPER_BREAK_EVEN_DELTA <= 0.2"
      priceVsMaxDebitRatio: 1
      leg1Long:
        conditions:
          - "DELTA >= 0.5"
          - "OPEN_INTEREST >= 100"
      leg2Short:
        conditions:
          - "OPEN_INTEREST >= 100"
      earningsFilters:
        conditions:
          - "DAYS_TO_NEXT_EARNINGS >= DTE"
    securitiesFile: "tracking, 2026"
  - alias: "Bullish ZEBRA"
    enabled: true
    termType: "Short Term"
    strategyType: "BULLISH_ZEBRA"
    descriptionFile: "bullish_zebra.md"
    filterType: "ZebraFilter"
    filter:
      conditions:
        - "DTE >= 30"
        - "DTE <= 45"
        - "ANNUALIZED_EXTRINSIC_PCT <= 0.5"
        - "MAX_LOSS <= 5000"
        - "BREAK_EVEN_PCT <= 5"
      shortCall:
        conditions:
          - "DELTA >= 0.45"
          - "OPEN_INTEREST >= 100"
      longCall:
        conditions:
          - "DELTA >= 0.65"
          - "OPEN_INTEREST >= 100"
      earningsFilters:
        conditions:
          - "DAYS_TO_NEXT_EARNINGS >= DTE"
    securitiesFile: "portfolio, tracking, 2026"
  - alias: "Short Put"
    enabled: true
    termType: "Short Term"
    strategyType: "SHORT_PUT"
    descriptionFile: "short_put.md"
    filterType: "CreditSpreadFilter"
    filter:
      conditions:
        - "DTE >= 25"
        - "DTE <= 50"
        - "MAX_LOSS <= 20000"
        - "RETURN_ON_RISK >= 6"
        - "IV_PERCENTILE >= 30"
      shortLeg:
        conditions:
          - "DELTA <= 0.2"
          - "OPEN_INTEREST >= 100"
      earningsFilters:
        conditions:
          - "DAYS_TO_NEXT_EARNINGS >= DTE"
    securitiesFile: "portfolio, tracking, 2026"
  - alias: "Short Put"
    enabled: true
    termType: "Medium Term"
    strategyType: "SHORT_PUT"
    descriptionFile: "short_put.md"
    filterType: "CreditSpreadFilter"
    filter:
      conditions:
        - "DTE >= 55"
        - "DTE <= 185"
        - "MAX_LOSS <= 20000"
        - "RETURN_ON_RISK >= 12"
        - "IV_PERCENTILE >= 30"
      shortLeg:
        conditions:
          - "DELTA <= 0.2"
          - "OPEN_INTEREST >= 100"
    securitiesFile: "portfolio, tracking, 2026"
  - alias: "Short Put"
    enabled: true
    termType: "Extra Long Term"
    strategyType: "SHORT_PUT"
    descriptionFile: "short_put.md"
    filterType: "CreditSpreadFilter"
    filter:
      conditions:
        - "DTE >= 330"
        - "MAX_LOSS <= 20000"
        - "CAGR >= 18"
        - "IV_PERCENTILE >= 30"
      shortLeg:
        conditions:
          - "DELTA <= 0.2"
          - "OPEN_INTEREST >= 1"
    securitiesFile: "portfolio, tracking, 2026"
  - alias: "Short Strangle"
    enabled: true
    termType: "Up To Medium Term"
    strategyType: "SHORT_STRANGLE"
    descriptionFile: "short_strangle.md"
    filterType: "ShortStrangleFilter"
    filter:
      conditions:
        - "DTE >= 0"
        - "DTE <= 100"
        - "MAX_LOSS <= 20000"
        - "RETURN_ON_RISK >= 12"
        - "IV_PERCENTILE >= 30"
      putShortLeg:
        conditions:
          - "DELTA <= 0.2"
      callShortLeg:
        conditions:
          - "DELTA <= 0.2"
      earningsFilters:
        conditions:
          - "DAYS_TO_NEXT_EARNINGS >= DTE"
          - "EARNINGS_NEAREST_TO_DTE <= DTE - 10"
    securitiesFile: "portfolio, 2026, tracking, top100"
    technicalFilters:
      HISTORICAL_VOLATILITY:
        config:
          period: 20
        conditions:
          - "HV_RANK >= 25"
technicalScreeners:
  - alias: "RSI/BB Bullish Crossover"
    enabled: true
    screenerType: "RSI_BB_BULLISH_CROSSOVER"
    securitiesFile: "top100, portfolio, tracking, 2026, SPY, QQQ"
    technicalFilters:
      RSI:
        config: "default"
        condition: "BULLISH_CROSSOVER"
      BOLLINGER_BAND:
        config: "default"
        condition: "LOWER_BAND"
      VOLUME:
        conditions:
          - "VOLUME >= 1000000"
  - alias: "RSI/BB Bearish Crossover"
    enabled: true
    screenerType: "RSI_BB_BEARISH_CROSSOVER"
    securitiesFile: "top100, portfolio, tracking, 2026, SPY, QQQ"
    technicalFilters:
      RSI:
        config: "default"
        condition: "BEARISH_CROSSOVER"
      BOLLINGER_BAND:
        config: "default"
        condition: "UPPER_BAND"
      VOLUME:
        conditions:
          - "VOLUME >= 1000000"
  - alias: "Below 200 Day SMA"
    enabled: true
    screenerType: "BELOW_200_DAY_SMA"
    securitiesFile: "top100, portfolio, tracking, 2026, SPY, QQQ"
    technicalFilters:
      SIMPLE_MOVING_AVERAGE:
        conditions:
          - "PRICE < SMA200"
      VOLUME:
        conditions:
          - "VOLUME >= 1000000"
  - alias: "RSI Oversold"
    enabled: true
    screenerType: "RSI_OVERSOLD"
    securitiesFile: "top100, portfolio, tracking, 2026, SPY, QQQ"
    technicalFilters:
      RSI:
        config: "default"
        condition: "OVERSOLD"
      VOLUME:
        conditions:
          - "VOLUME >= 1000000"
  - alias: "BB Lower Band"
    enabled: true
    screenerType: "BB_LOWER"
    securitiesFile: "top100, portfolio, tracking, 2026, SPY, QQQ"
    technicalFilters:
      BOLLINGER_BAND:
        config: "default"
        condition: "LOWER_BAND"
      VOLUME:
        conditions:
          - "VOLUME >= 1000000"
  - alias: "Intraday Drop"
    enabled: true
    screenerType: "PRICE_DROP"
    securitiesFile: "top100, portfolio, tracking, 2026, SPY, QQQ"
    technicalFilters:
      PRICE_DROP:
        conditions:
          - "DROP_PCT >= 3"
        config:
          lookbackDays: 0
  - alias: "5-Day Drop"
    enabled: true
    screenerType: "PRICE_DROP"
    securitiesFile: "top100, portfolio, tracking, 2026, SPY, QQQ"
    technicalFilters:
      PRICE_DROP:
        conditions:
          - "DROP_PCT >= 5"
        config:
          lookbackDays: 5
  - alias: "1-Month Drop"
    enabled: true
    screenerType: "PRICE_DROP"
    securitiesFile: "top100, portfolio, tracking, 2026, SPY, QQQ"
    technicalFilters:
      PRICE_DROP:
        conditions:
          - "DROP_PCT >= 10"
        config:
          lookbackDays: 21
  - alias: "3-Month Drop"
    enabled: true
    screenerType: "PRICE_DROP"
    securitiesFile: "top100, portfolio, tracking, 2026, SPY, QQQ"
    technicalFilters:
      PRICE_DROP:
        conditions:
          - "DROP_PCT >= 15"
        config:
          lookbackDays: 63
  - enabled: true
    alias: "Down from 52W High"
    screenerType: "HIGH_52W_DROP"
    securitiesFile: "top100, portfolio, tracking, 2026, SPY, QQQ"
    technicalFilters:
      PRICE_DROP:
        conditions:
          - "DROP_PCT >= 20"
    fundamentalFilters:
      MARKET_CAP:
        conditions:
          - "MARKET_CAP_B >= 1"
  - enabled: true
    alias: "ATR Screener"
    screenerType: "ATR"
    descriptionFile: "atr_screener.md"
    securitiesFile: "top100, portfolio, tracking, 2026, SPY, QQQ"
    technicalFilters:
      AVERAGE_TRUE_RANGE:
        config:
          period: 14
        conditions:
          - "NATR >= 1.5"
          - "PRICE_DROP_FROM_HIGH_5D >= 2 * ATR"
      VOLUME:
        conditions:
          - "VOLUME >= 1000000"
