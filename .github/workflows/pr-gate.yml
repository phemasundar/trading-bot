name: PR Coverage Gate

on:
    pull_request:
        branches:
            - main

jobs:
    coverage-check:
        runs-on: ubuntu-latest
        name: Verify 60% Unit Test Coverage

        env:
            # Inject secrets as environment variables required by application context
            SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
            SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
            SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
            TELEGRAM_ENABLED: "false"

        steps:
            - name: Checkout Code
              uses: actions/checkout@v4

            - name: Set up JDK 21
              uses: actions/setup-java@v4
              with:
                  java-version: "21"
                  distribution: "temurin"
                  cache: maven

            - name: Run Unit Tests and Verify Coverage
              # This will run the `jacoco:check` goal and fail the build if coverage is < 60%
              run: mvn clean verify

            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: '20'

            - name: Install Frontend Dependencies
              run: npm install

            - name: Run Frontend Tests and Verify Coverage
              run: npm test

            - name: Upload Coverage Report
              uses: actions/upload-artifact@v4
              if: always()
              with:
                  name: jacoco-coverage-report
                  path: target/site/jacoco/
