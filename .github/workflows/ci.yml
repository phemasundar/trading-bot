name: Trading Bot CI

on:
  schedule:
    # Morning: 20 min after market open (9:50 AM EDT / 8:50 AM CDT = 13:50 UTC, Mon-Fri)
    # Note: During EST (Standard Time, Nov-Mar), 9:50 AM EST is 14:50 UTC
    - cron: "50 13 * * 1-5"
    # Evening: 30 min before market close (3:30 PM EDT / 2:30 PM CDT = 19:30 UTC, Mon-Fri)
    # Note: During EST (Standard Time, Nov-Mar), 3:30 PM EST is 20:30 UTC
    - cron: "30 19 * * 1-5"
  workflow_dispatch: # Allow manual trigger

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      # Timezone: Dallas, TX (CDT/CST)
      TZ: America/Chicago
      # Inject secrets as environment variables
      REFRESH_TOKEN: ${{ secrets.REFRESH_TOKEN }}
      APP_KEY: ${{ secrets.APP_KEY }}
      APP_SECRET: ${{ secrets.APP_SECRET }}
      FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
      FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: develop

      - name: Debug Environment
        run: |
          echo "Current directory: $(pwd)"
          echo "Git status:"
          git status
          echo "Current HEAD:"
          git log -1 --format="%H - %s"
          echo "Remote refs:"
          git ls-remote --heads origin

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: maven

      - name: Run Tests (Bot Execution)
        run: mvn spring-boot:run "-Dspring-boot.run.jvmArguments=-Duser.timezone=America/Chicago" "-Dspring-boot.run.arguments=--app.job.name=SCREENER"


